[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "decision-memory-layer"
version = "0.1.0"
description = "Persistent organizational memory system for AI-native enterprise decision intelligence"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Akash Raj" },
    { name = "Prem Kumar" },
]
dependencies = [
    "fastapi>=0.111,<1",
    "uvicorn[standard]>=0.29,<1",
    "pydantic>=2.7,<3",
    "aiosqlite>=0.20,<1",
    "networkx>=3.3,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.23,<1",
    "httpx>=0.27,<1",
    "ruff>=0.4,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/decision_memory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]
